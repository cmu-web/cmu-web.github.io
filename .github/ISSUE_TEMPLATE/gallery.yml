name: Add to the Gallery
description: A site, app or QR code made with CMU Web, for the Gallery page.
title: "Gallery: "
labels: [gallery]
body:
  - type: markdown
    attributes:
      value: |
        The [Gallery](https://cmu-web.github.io/gallery.html) shows Carnegie Mellon sites,
        apps and QR codes made with CMU Web. For a site or app, we'll take the screenshot
        ourselves, from what anyone can see without signing in. For a QR code, a photo is
        plenty.
  - type: dropdown
    id: kind
    attributes:
      label: What It Is
      options:
        - A site or app built with the Web Kilt
        - A site built with Jekyll & Plaid
        - A QRnegie code in the wild (a poster, slide, table tent and so on)
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      description: What the site, app or event is called.
    validations:
      required: true
  - type: input
    id: address
    attributes:
      label: Address
      description: For a site or app. For a QR code, where you saw it.
      placeholder: https://www.cmu.edu/…
  - type: input
    id: owner
    attributes:
      label: Who Runs It
      description: The office, department or group.
  - type: textarea
    id: about
    attributes:
      label: About It
      description: A sentence or two, for the caption. For a QR code, attach a photo here.
    validations:
      required: true
  - type: checkboxes
    id: ok
    attributes:
      label: Permission
      options:
        - label: The group that runs it is fine with it appearing in the Gallery.
          required: true
