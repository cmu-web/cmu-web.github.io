version: 2
updates:
  - package-ecosystem: bundler
    # The gems GitHub Pages builds with
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # Minor and patch updates in one pull request; majors stay separate
      bundler-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
